name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app/
      - run: mypy app/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Static analysis
        run: bandit -r app/ -c pyproject.toml
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest app/tests -m "not integration" -v

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: polymarket
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/polymarket
      API_KEY: test-key
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Restore sampled seed data
        run: gunzip -c docker/initdb/seed.sql.gz | psql -U app -d polymarket -h localhost -v ON_ERROR_STOP=1
        env:
          PGPASSWORD: app
      - name: Run pending migrations
        run: alembic upgrade head
      - name: Run integration tests
        run: python -m pytest app/tests -m integration -v

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Follow the README quick start verbatim
        run: |
          cp .env.sample .env
          sed -i "s/^API_KEY=.*/API_KEY=$(openssl rand -hex 32)/" .env
          docker compose up -d --build
      - name: Wait for the API to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health > /dev/null; then exit 0; fi
            sleep 5
          done
          docker compose logs
          exit 1
      - name: Assert the seeded data is served
        run: |
          test "$(curl -s 'http://localhost:8000/api/v1/leaderboard?limit=5' | jq '.data | length')" = "5"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/leaderboard)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/follow)" = "401"
      - name: Tear down
        if: always()
        run: docker compose down -v
