name: POLYMARKET_TRIGGER_ORCHESTRATOR
pipeline_uuid: ingestion_market_discovery
schedule_interval: "@daily"
schedule_type: time
start_time: "2026-06-17T06:00:00"
status: active

variables:
  run_date: "{{ execution_date }}"
  backfill_days: 1

settings:
  sla: 300
  allow_parallel_runs: false
  landing_time_enabled: true
  landing_time_interval: 300

notification_config:
  alert_on:
    - trigger_failure
    - trigger_passed_sla

runtime_parameters:
  - name: run_date
    type: string
    required: true
    default: "{{ execution_date }}"
  - name: backfill_days
    type: int
    required: false
    default: 1
