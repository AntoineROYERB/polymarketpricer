services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: polymarket
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
  mage:
    build:
      context: ./magic
      dockerfile: Dockerfile
    depends_on: [postgres]
    environment:
      DATABASE_URL: postgresql+asyncpg://app:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/polymarket
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL}"
      TARGET_WALLET_COUNT: "${TARGET_WALLET_COUNT:-1000}"
      VERIFY_MIN_WALLETS: "${VERIFY_MIN_WALLETS:-500}"
      VERIFY_MIN_TRADES: "${VERIFY_MIN_TRADES:-25000}"
      VERIFY_MIN_WALLET_ANALYTICS: "${VERIFY_MIN_WALLET_ANALYTICS:-2}"
      VERIFY_MIN_RANKING_SNAPSHOTS: "${VERIFY_MIN_RANKING_SNAPSHOTS:-5}"
    mem_limit: ${MAGE_MEM_LIMIT:-8g}
    ports:
      - "127.0.0.1:6789:6789"
    volumes:
      - ./magic:/home/src
  app:
    build: .
    depends_on: [postgres]
    environment:
      DATABASE_URL: postgresql+asyncpg://app:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/polymarket
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL}"
      ALERT_POLL_INTERVAL_SECONDS: ${ALERT_POLL_INTERVAL_SECONDS:-10}
      API_KEY: ${API_KEY:?Set API_KEY in your .env file (e.g. openssl rand -hex 32)}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        API_PROXY_URL: http://app:8000
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      API_PROXY_URL: http://app:8000
    env_file:
      - .env
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
