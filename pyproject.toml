[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
markers = [
    "integration: tests that connect to a real database",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header", "fastapi.Body"]

[tool.mypy]
ignore_missing_imports = true
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.bandit]
# Tests assert with `assert` (B101) and build integrity queries from hardcoded
# table names (B608); neither is a finding in application code.
exclude_dirs = ["app/tests"]
